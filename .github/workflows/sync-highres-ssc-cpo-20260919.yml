name: Sync high-res SSC CPO 2026 assets

on:
  push:
    branches:
      - social-assets
    paths:
      - .github/workflows/sync-highres-ssc-cpo-20260919.yml

permissions:
  contents: write

jobs:
  sync-highres:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout social-assets branch
        uses: actions/checkout@v4
        with:
          ref: social-assets
          fetch-depth: 0

      - name: Download verified high-resolution carousel assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p social-media/hosted/TMT-20260919-PM

          download() {
            local id="$1"
            local out="$2"
            curl -L --fail --retry 3 --retry-delay 2 "https://drive.google.com/uc?export=download&id=${id}" -o "$out"
            local bytes
            bytes=$(stat -c%s "$out")
            echo "$out => $bytes bytes"
            if [ "$bytes" -lt 700000 ]; then
              echo "ERROR: $out is below 700 KB"
              exit 1
            fi
          }

          download "1-wRYN8MBI3PUu7j_dxVcehwgwc9en0Mq" "social-media/hosted/TMT-20260919-PM/slide-01.jpg"
          download "1JzExvJr30lJkLAv3wWgtfjmYCejx7TJZ" "social-media/hosted/TMT-20260919-PM/slide-02.jpg"
          download "1PPVjOhYh0CyBWE7_X9Ivan0FPQsNIGou" "social-media/hosted/TMT-20260919-PM/slide-03.jpg"
          download "1-TcT3-xtMDieV1jwwXXpa-V4mbF8MOIS" "social-media/hosted/TMT-20260919-PM/slide-04.jpg"
          download "1_hPHdS11nBuhuvuDNkfK6OWlQnrbH5RE" "social-media/hosted/TMT-20260919-PM/slide-05.jpg"
          download "15WhOd4IoY8MAh6Cfzg_X429mTCL6I6qd" "social-media/hosted/TMT-20260919-PM/slide-06.jpg"

      - name: Verify every JPEG is 1080 x 1350 and above 700 KB
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = sorted(Path('social-media/hosted/TMT-20260919-PM').glob('slide-*.jpg'))

          def jpeg_size(path):
              data = path.read_bytes()
              if data[:2] != b'\xff\xd8':
                  raise ValueError(f'{path}: not a JPEG')
              i = 2
              sof = {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
              while i < len(data):
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xFF:
                      i += 1
                  marker = data[i]
                  i += 1
                  if marker in (0xD8,0xD9):
                      continue
                  length = int.from_bytes(data[i:i+2], 'big')
                  if marker in sof:
                      h = int.from_bytes(data[i+3:i+5], 'big')
                      w = int.from_bytes(data[i+5:i+7], 'big')
                      return w, h
                  i += length
              raise ValueError(f'{path}: JPEG dimensions not found')

          assert len(files) == 6, f'Expected 6 slides, found {len(files)}'
          for f in files:
              w, h = jpeg_size(f)
              size = f.stat().st_size
              print(f'{f}: {w}x{h}, {size} bytes')
              assert (w, h) == (1080, 1350), f'{f}: wrong dimensions {w}x{h}'
              assert size >= 700000, f'{f}: file below 700 KB'
          PY

      - name: Commit corrected public assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-media/hosted/TMT-20260919-PM/slide-*.jpg
          git commit -m "[social-assets] Add SSC CPO 2026 high-res carousel"
          git push origin HEAD:social-assets
