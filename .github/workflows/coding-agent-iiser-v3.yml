name: Coding Agent IISER V3 QA
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: python scripts/coding-agent-iiser.py
      - run: python scripts/coding-agent-iiser-fix.py
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run qa:questions
      - run: npm run collision-reference
      - run: npm run qa:questions
      - run: npm run lint
      - run: npm run qa:assets
      - run: npm run build
      - run: npm run qa:onpage-seo
      - run: npm run qa:site
      - run: python scripts/coding-agent-iiser.py
      - run: python scripts/coding-agent-iiser-fix.py
      - name: Commit integration
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name 'TakeMockTest Coding Agent'
            git config user.email 'actions@users.noreply.github.com'
            git add -A
            git commit -m 'Integrate IISER IAT 2026'
            git push
          fi
