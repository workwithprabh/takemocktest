name: Debug Validator 3
on:
  push:
    branches: [main]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate variable checked-bank length guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('src').rglob('*'):
            if not p.is_file() or p.suffix not in {'.ts','.tsx','.js','.mjs'}: continue
            try: lines=p.read_text().splitlines()
            except: continue
            for i,line in enumerate(lines):
              low=line.lower()
              if ('100' in line and ('length' in low or 'question' in low or 'checked' in low)) or 'must contain exactly' in low:
                print(f'FILE {p} LINE {i+1}')
                for j in range(max(0,i-8),min(len(lines),i+10)):
                  print(f'{j+1}: {lines[j]}')
                print('---')
          PY
          exit 1
