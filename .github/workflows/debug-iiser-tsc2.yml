name: Debug IISER TSC 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: python scripts/coding-agent-iiser.py
      - run: npm ci
      - name: Capture typecheck
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > coding-iiser-tsc.txt 2>&1
          code=$?
          cat coding-iiser-tsc.txt
          git config user.name 'TakeMockTest Coding Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -f coding-iiser-tsc.txt
          git commit -m 'Capture IISER typecheck output'
          git push
          exit $code
