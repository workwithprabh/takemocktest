name: Index coverage audit

# Answers the question Search Analytics cannot: how much of the site has Google
# actually indexed?
#
# Over the 90 days to 10 September 2026 the per-URL panel recorded 113
# impressions across 26 distinct pages, out of 1,787 indexable ones, and not a
# single impression on any of the 783 sectional test pages. Two very different
# situations produce that reading — Google never crawled them, or Google indexed
# them and never has reason to show them — and they call for opposite work. Only
# URL Inspection separates the two.
#
# Runs on demand rather than on a schedule: it spends one API call per URL
# against a daily quota, and the answer changes over weeks, not hours.

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Sample file to inspect'
        required: false
        default: 'data/index-audit-sample.tsv'

permissions:
  contents: write

concurrency:
  group: index-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Inspect sample
        env:
          GSC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_KEY_JSON" ]; then
            echo "GSC_SERVICE_ACCOUNT_KEY_JSON secret is not set — see scripts/gsc-query.py for setup." >&2
            exit 1
          fi
          python3 scripts/gsc-query.py inspect \
            --sample "${{ github.event.inputs.sample || 'data/index-audit-sample.tsv' }}" \
            --out data/index-audit-result.json

      - name: Commit result if changed
        run: |
          if ! git diff --quiet -- data || [ -n "$(git status --porcelain data)" ]; then
            git config user.name 'TakeMockTest Coding Agent'
            git config user.email 'actions@users.noreply.github.com'
            git add data
            git commit -m 'Update index coverage audit'
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((attempt * 5))
            done
            echo "Could not push audit after 3 attempts." >&2
            exit 1
          else
            echo "No change in audit — skipping commit."
          fi
