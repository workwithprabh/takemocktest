name: Sync high-res social assets

on:
  push:
    branches:
      - social-assets
    paths:
      - .github/workflows/sync-highres-social-assets.yml

permissions:
  contents: write

jobs:
  sync-highres:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout social-assets branch
        uses: actions/checkout@v4
        with:
          ref: social-assets
          fetch-depth: 0

      - name: Download verified high-resolution carousel assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p social-media/hosted/TMT-20260916-AM social-media/hosted/TMT-20260916-PM

          download() {
            local id="$1"
            local out="$2"
            curl -L --fail --retry 3 --retry-delay 2 "https://drive.google.com/uc?export=download&id=${id}" -o "$out"
            local bytes
            bytes=$(stat -c%s "$out")
            echo "$out => $bytes bytes"
            if [ "$bytes" -lt 700000 ]; then
              echo "ERROR: $out is below 700 KB"
              exit 1
            fi
          }

          download "1esiq5bTGTtx3T8JX8ma2Nsf9CDA-zAYx" "social-media/hosted/TMT-20260916-AM/slide-01.jpg"
          download "1MxT-zrSSE56raFJN7pPpx6KsS1pl9yRK" "social-media/hosted/TMT-20260916-AM/slide-02.jpg"
          download "1mOasoJGb2kd0cg0IW5Ugtp-mexkdCjV2" "social-media/hosted/TMT-20260916-AM/slide-03.jpg"
          download "1XgH3qlSMKZnNuxrNJ8chpWSrH2NLQRb7" "social-media/hosted/TMT-20260916-AM/slide-04.jpg"
          download "1E4_yMyOpLDkSosRuGyfA4d11mpmC7dKG" "social-media/hosted/TMT-20260916-AM/slide-05.jpg"
          download "1ewzyaLtYpYwNnGeRBLo2y32kCMhWQpZB" "social-media/hosted/TMT-20260916-AM/slide-06.jpg"

          download "1tUZU0LAxgUTOwkWmY9hrsJtBBFU0EtNV" "social-media/hosted/TMT-20260916-PM/slide-01.jpg"
          download "1ob6pWbCEryLu3uta9IAGAnG35HsBfbdf" "social-media/hosted/TMT-20260916-PM/slide-02.jpg"
          download "107htw6Rja3eD4hSo890_uBasdt4XiybI" "social-media/hosted/TMT-20260916-PM/slide-03.jpg"
          download "1uWCV98vriQ6gXIYqn-6ftmPUcVA2Vo_a" "social-media/hosted/TMT-20260916-PM/slide-04.jpg"
          download "1y_wIeeqwUDDcn1jxsG-cXN54W2XNk3Vd" "social-media/hosted/TMT-20260916-PM/slide-05.jpg"
          download "1Voyf0vpBZR17mMPbvKiI-3EVRAT9CImd" "social-media/hosted/TMT-20260916-PM/slide-06.jpg"

      - name: Verify every JPEG is 1080 x 1350
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = sorted(Path('social-media/hosted/TMT-20260916-AM').glob('slide-*.jpg')) + sorted(Path('social-media/hosted/TMT-20260916-PM').glob('slide-*.jpg'))

          def jpeg_size(path):
              data = path.read_bytes()
              if data[:2] != b'\xff\xd8':
                  raise ValueError(f'{path}: not a JPEG')
              i = 2
              sof = {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
              while i < len(data):
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xFF:
                      i += 1
                  marker = data[i]
                  i += 1
                  if marker in (0xD8,0xD9):
                      continue
                  length = int.from_bytes(data[i:i+2], 'big')
                  if marker in sof:
                      h = int.from_bytes(data[i+3:i+5], 'big')
                      w = int.from_bytes(data[i+5:i+7], 'big')
                      return w, h
                  i += length
              raise ValueError(f'{path}: JPEG dimensions not found')

          for f in files:
              w, h = jpeg_size(f)
              size = f.stat().st_size
              print(f'{f}: {w}x{h}, {size} bytes')
              assert (w, h) == (1080, 1350), f'{f}: wrong dimensions {w}x{h}'
              assert size >= 700000, f'{f}: file below 700 KB'
          PY

      - name: Commit corrected public assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-media/hosted/TMT-20260916-AM/slide-*.jpg social-media/hosted/TMT-20260916-PM/slide-*.jpg
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
            exit 0
          fi
          git commit -m "[social-assets] Replace Sep 16 carousels with verified high-res files"
          git push origin HEAD:social-assets
