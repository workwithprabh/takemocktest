name: Sync high-res Government Exams carousel

on:
  push:
    branches:
      - social-assets
    paths:
      - .github/workflows/sync-highres-govt-exams-20260920.yml

permissions:
  contents: write

jobs:
  sync-highres:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout social-assets branch
        uses: actions/checkout@v4
        with:
          ref: social-assets
          fetch-depth: 0

      - name: Download verified high-resolution carousel assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p social-media/hosted/TMT-20260920-AM

          download() {
            local id="$1"
            local out="$2"
            curl -L --fail --retry 3 --retry-delay 2 "https://drive.google.com/uc?export=download&id=${id}" -o "$out"
            local bytes
            bytes=$(stat -c%s "$out")
            echo "$out => $bytes bytes"
            if [ "$bytes" -lt 700000 ]; then
              echo "ERROR: $out is below 700 KB"
              exit 1
            fi
          }

          download "1jpINgt4L0QFNERhdgpKJsYamf_dlzeEP" "social-media/hosted/TMT-20260920-AM/slide-01.jpg"
          download "1LB8zAusEDkRXbEXoyfGzOK8LNnLXy1PC" "social-media/hosted/TMT-20260920-AM/slide-02.jpg"
          download "12bFrVAV8SpFo_11FY0sKF8xD6RzTjWoC" "social-media/hosted/TMT-20260920-AM/slide-03.jpg"
          download "1C23ExvPrNc7y2prJ_ISTKqU8kwm4lrd0" "social-media/hosted/TMT-20260920-AM/slide-04.jpg"
          download "1njYpmcT0xMMczZKdb2nUjuLBol05bx1v" "social-media/hosted/TMT-20260920-AM/slide-05.jpg"
          download "1F_CWzeKQ9AifLQBKnQIdMundu8jMtiIg" "social-media/hosted/TMT-20260920-AM/slide-06.jpg"
          download "1mI3jjPCyAr2bX1R_BtWkpcIKyMQyUTKJ" "social-media/hosted/TMT-20260920-AM/slide-07.jpg"
          download "1Dag8b6wo89DTUNl89wKeYs1mDrdYU7rN" "social-media/hosted/TMT-20260920-AM/slide-08.jpg"

      - name: Verify every JPEG is 1080 x 1350 and above 700 KB
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = sorted(Path('social-media/hosted/TMT-20260920-AM').glob('slide-*.jpg'))

          def jpeg_size(path):
              data = path.read_bytes()
              if data[:2] != b'\xff\xd8':
                  raise ValueError(f'{path}: not a JPEG')
              i = 2
              sof = {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
              while i < len(data):
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xFF:
                      i += 1
                  marker = data[i]
                  i += 1
                  if marker in (0xD8,0xD9):
                      continue
                  length = int.from_bytes(data[i:i+2], 'big')
                  if marker in sof:
                      h = int.from_bytes(data[i+3:i+5], 'big')
                      w = int.from_bytes(data[i+5:i+7], 'big')
                      return w, h
                  i += length
              raise ValueError(f'{path}: JPEG dimensions not found')

          assert len(files) == 8, f'Expected 8 slides, found {len(files)}'
          for f in files:
              w, h = jpeg_size(f)
              size = f.stat().st_size
              print(f'{f}: {w}x{h}, {size} bytes')
              assert (w, h) == (1080, 1350), f'{f}: wrong dimensions {w}x{h}'
              assert size >= 700000, f'{f}: file below 700 KB'
          PY

      - name: Commit public assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-media/hosted/TMT-20260920-AM/slide-*.jpg
          git commit -m "[social-assets] Add government exams after graduation high-res carousel"
          git push origin HEAD:social-assets
